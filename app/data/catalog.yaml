    label: Руль
    label_uz: Rul
    photo: rul.jpg
    noun: руль
    noun_cap: Руль
    noun_cap_uz: Rul
    acc: руль
    title: Рули
    title_uz: Rullar
    sub: Кожа, карбон, подрулевые лепестки и LED-подсветка.
    sub_uz: Teri, karbon, rul kurakchalari va LED-yoritish.
    shoot_title: Сфотографируйте руль
    shoot_title_uz: Rulni suratga oling
    pick_sub: Кожа, карбон, LED
    pick_sub_uz: Teri, karbon, LED
    is_wheel: true
    gen_steps:
      - Определяем положение старого руля
      - Настраиваем размер и перспективу
      - Добавляем выбранный руль
      - Подстраиваем освещение и отражения
      - Проверяем результат
    gen_steps_uz:
      - Eski rul holatini aniqlaymiz
      - Oʻlcham va perspektivani sozlaymiz
      - Tanlangan rulni qoʻshamiz
      - Yoritish va aks etishlarni moslaymiz
      - Natijani tekshiramiz
    # Рули — готовый продукт, магазин их не дорабатывает: никаких опций отделки.
    # Покупатель выбирает руль и сразу видит его на своей машине. Флаги ниже
    # питают строку фильтров (Карбон / LED / Лепестки), а не настройки товара.
    option_groups: []
    products:
      # Товары названы по реальным рулям, снятым для эталонов генерации (фото в
      # web/img/products/). ID сохранены — на них ссылаются сохранённые корзины.
