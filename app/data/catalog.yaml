# MyCar Vision AI — каталог магазина.
# Цены в сумах, целыми числами. Правится владельцем магазина без изменения кода.
# Валидируется при старте приложения (app/services/catalog_service.py).
#
# Узбекские поля (*_uz) — перевод на узбекский (латиница). Сделан не носителем,
# ТРЕБУЕТ ВЫЧИТКИ перед запуском. Если *_uz пусто — показывается русский текст.

car_options:
  brands: [Chevrolet, Ravon, Daewoo]
  models: [Cobalt, Malibu, Nexia, Gentra]
  years: [2021, 2022, 2023, 2024]

